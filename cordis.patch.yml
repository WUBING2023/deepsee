# DeepSee is a normal DSH bundle layer. The plugin itself owns runtime
# discovery, its same-origin Web route, and the Prime preset lifecycle.
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates: [AGENTS.md, CLAUDE.md, agent.md]
    localInstructionFileCandidates: [AGENTS.local.md, CLAUDE.local.md, agent.local.md]

# Route native Harness Workflow children through DeepSee first. The DeepSee
# provider delegates ordinary API/Harness routes back to `spawn`, while verified
# CLI routes are handed to their native product providers (Codex/Claude Code).
- id: workflow-worker-thread
  config:
    provider: opends

- insert:
    - id: deepsee-codex
      name: '@wubing2023/deepsee/codex'
      config: {}

    - id: deepsee
      name: '@wubing2023/deepsee'
      config:
        enabled: true
        provider: ''
        model: ''
        maxTokens: 4096
        autoVision: true
        allowTextTool: false
        targetProviders: [deepseek-official, deepseek]
        visionCacheEntries: 128
        visionRoute: opends-vision
        primaryProvider: deepseek-official
        registryFile: ''
        routeOverrides: []
        primeAutoWorkflow: true
        visionMode: model
        ocrExecutable: ''
