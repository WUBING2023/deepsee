name: Deploy product site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepsee-product-site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify the public Release and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./product-release.json').product.version")"
          TAG="v${VERSION}"
          ASSET="deepsee-${VERSION}.tgz"
          mkdir -p .release-check
          gh release download "$TAG" --pattern "$ASSET" --pattern "${ASSET}.sha256" --dir .release-check
          (cd .release-check && sha256sum -c "${ASSET}.sha256")
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('website/version.json'));const s=fs.readFileSync('.release-check/${ASSET}.sha256','utf8').trim().split(/\\s+/)[0];if(m.version!=='${VERSION}'||m.sha256!==s)throw new Error('Website manifest does not match the public Release')"
          node scripts/validate-site.mjs

      - name: Detect Cloudflare deployment credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are absent; deployment is skipped and the existing production page will be verified instead."
          fi

      - name: Deploy the static directory to Cloudflare Pages
        if: steps.cloudflare.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy website --project-name deepsee-wubing2023 --branch main

      - name: Verify the production manifest
        env:
          PRODUCTION_MANIFEST_URL: https://deepsee-wubing2023.pages.dev/version.json
        run: >-
          node --input-type=module -e
          "import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('website/version.json','utf8'));
          let actual;
          for(let attempt=0;attempt<6;attempt+=1){
            const response=await fetch(process.env.PRODUCTION_MANIFEST_URL,{cache:'no-store'});
            if(response.ok){actual=await response.json();
              if(actual.version===expected.version&&actual.sha256===expected.sha256)break;}
            await new Promise(resolve=>setTimeout(resolve,5000));}
          if(!actual||actual.version!==expected.version||actual.sha256!==expected.sha256)
            throw new Error('Production Pages manifest does not match the verified public Release');
          console.log(JSON.stringify({ok:true,version:actual.version,sha256:actual.sha256}));"
